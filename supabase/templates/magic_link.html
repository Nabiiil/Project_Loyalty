<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Your sign-in code</title>
</head>
<body style="font-family: sans-serif; background: #fff; color: #111; padding: 40px 24px; max-width: 480px; margin: 0 auto;">
  <h2 style="margin: 0 0 8px; font-size: 20px;">Your sign-in code</h2>
  <p style="margin: 0 0 24px; color: #555; font-size: 14px;">Enter this code on the page to continue:</p>

  <div style="background: #f4f4f5; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px;">
    <span style="font-size: 40px; font-weight: 700; letter-spacing: 10px; color: #111;">{{ .Token }}</span>
  </div>

  <p style="margin: 0 0 8px; font-size: 14px; color: #555;">This code expires in 1 hour.</p>
  <p style="margin: 0; font-size: 12px; color: #999;">If you didn't request this, you can ignore this email.</p>
</body>
</html>
